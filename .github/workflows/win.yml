name: win-vps

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: '最长运行分钟数'
        required: false
        default: '350'
      note:
        description: '备注（可留空）'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: win-vps
  cancel-in-progress: false

jobs:
  win:
    runs-on: windows-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: 开 RDP + 中文环境 + 隧道
        shell: pwsh
        timeout-minutes: 350
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_MINUTES: ${{ inputs.minutes }}
        run: |
          $ErrorActionPreference = 'Continue'
          Add-Type -AssemblyName System.DirectoryServices.AccountManagement

          function Test-Pw([string]$user, [string]$pass) {
            try {
              $ctx = New-Object System.DirectoryServices.AccountManagement.PrincipalContext('Machine')
              return $ctx.ValidateCredentials($user, $pass)
            } catch { return $false }
          }

          Write-Host '=== 1. 账户信息（设置前）==='
          $before = Get-LocalUser -Name 'runneradmin' -ErrorAction SilentlyContinue
          if ($before) { Write-Host ('Enabled=' + $before.Enabled + ' PwExpires=' + $before.PasswordExpires + ' LastSet=' + $before.PasswordLastSet) }
          else { Write-Host 'runneradmin 不存在！'; Get-LocalUser | ForEach-Object { Write-Host ('  本地账户: ' + $_.Name) } }

          Write-Host '=== 2. 设置密码（多候选，逐个实测）==='
          $cands = @('Runner2024', 'Runner2024!', 'Gh2024vps')
          $pw = $null
          foreach ($c in $cands) {
            try {
              $sec = ConvertTo-SecureString $c -AsPlainText -Force
              Set-LocalUser -Name 'runneradmin' -Password $sec -ErrorAction Stop
              Start-Sleep -Seconds 2
              if (Test-Pw 'runneradmin' $c) { $pw = $c; Write-Host ('  ✅ 可用密码: ' + $c); break }
              else { Write-Host ('  ⚠️ 设了 ' + $c + ' 但验证不过') }
            } catch { Write-Host ('  ❌ ' + $c + ' 设置失败: ' + $_) }
          }
          if (-not $pw) { Write-Host '所有候选密码都失败！' }

          Write-Host '=== 3. 启用账户 / 不过期 / 加组 ==='
          Enable-LocalUser -Name 'runneradmin' -ErrorAction SilentlyContinue
          Set-LocalUser -Name 'runneradmin' -PasswordNeverExpires $true -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group 'Remote Desktop Users' -Member 'runneradmin' -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group 'Administrators' -Member 'runneradmin' -ErrorAction SilentlyContinue
          $after = Get-LocalUser -Name 'runneradmin'
          Write-Host ('Enabled=' + $after.Enabled + ' PwExpires=' + $after.PasswordExpires)

          Write-Host '=== 4. 开远程桌面 ==='
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 0
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop' -ErrorAction SilentlyContinue
          Set-Service -Name TermService -StartupType Automatic
          Start-Service TermService -ErrorAction SilentlyContinue
          $ts = (Get-Service TermService).Status
          Write-Host ('TermService = ' + $ts)
          $hostname = $env:COMPUTERNAME
          Write-Host ('主机名 = ' + $hostname)

          Write-Host '=== 5. 中文环境（后台安装，不影响出机速度）==='
          $cnB64 = @(
            '77u/IyDkuK3mlofnjq/looMgdjIg4oCU4oCUIOS4jeazqOmUgOOAgeS4jemHjeWQr+acuuWZqO+8jOebtOaOpeWIt+aWsOahjOmd'
            'ouWkluWjswojIOmAgueUqOS6jiBHaXRIdWIgQWN0aW9ucyB3aW5kb3dzLWxhdGVzdCAoV2luZG93cyBTZXJ2ZXIgMjAyNSkg55qE'
